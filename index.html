<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>配詞遊戲｜將軍澳培智學校</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:"PingFang HK","Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:#D6EEFF;color:#1a3a5c;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;overflow:hidden}
body{display:flex;flex-direction:column}
.header{flex:0 0 auto;text-align:center;padding:10px 12px 6px;background:rgba(255,255,255,.55);
  border-bottom:3px solid #7eb8e8}
.header h1{font-size:clamp(1.15rem,3.5vw,1.7rem);font-weight:900;color:#1e5a8a;letter-spacing:.04em}
.header .sub{font-size:clamp(.95rem,2.5vw,1.15rem);font-weight:800;color:#3a7ab0;margin-top:2px}
.main{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;overflow:auto}
.footer{flex:0 0 auto;text-align:center;padding:8px;font-size:.9rem;font-weight:700;
  color:#4a6f90;background:rgba(255,255,255,.4);border-top:2px solid #b8d9f0}
.screen{display:none;width:min(720px,100%);margin:0 auto}
.screen.on{display:block}
.card{background:#fff;border-radius:24px;padding:22px 18px;box-shadow:0 10px 28px rgba(30,90,138,.14);
  border:3px solid #a8d4f5}
.card h2{font-size:clamp(1.5rem,4vw,2rem);font-weight:900;text-align:center;margin-bottom:14px;color:#1e5a8a}
label.field{display:block;font-size:1.15rem;font-weight:800;margin:10px 0 6px;color:#2a5f8a}
input.name{width:100%;font-size:1.35rem;font-weight:800;padding:14px 16px;border:3px solid #7eb8e8;
  border-radius:16px;background:#f0f8ff;outline:none;min-height:56px}
input.name:focus{border-color:#2b8ad9;box-shadow:0 0 0 4px rgba(43,138,217,.2)}
.time-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0 14px}
.time-btn{min-height:56px;border-radius:14px;border:3px solid #90CAF9;background:#F5FBFF;
  font-size:1.15rem;font-weight:900;color:#1565C0;cursor:pointer}
.time-btn.on{background:#1E88E5;border-color:#1565C0;color:#fff;box-shadow:0 3px 0 #0D47A1}
.time-btn:active{transform:scale(.97)}
.speak-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:160px;
  min-height:56px;margin:0 auto 12px;padding:10px 18px;border-radius:16px;border:4px solid #7E57C2;
  background:#EDE7F6;color:#4527A0;font-size:1.25rem;font-weight:900;cursor:pointer}
.speak-btn:active{transform:scale(.97)}
.diff-grid{display:grid;gap:12px;margin:16px 0 8px}
.diff-btn{display:flex;align-items:center;gap:12px;justify-content:flex-start;min-height:80px;
  padding:14px 18px;border-radius:18px;border:4px solid transparent;font-size:1.35rem;font-weight:900;
  cursor:pointer;transition:transform .12s,box-shadow .12s;text-align:left;width:100%}
.diff-btn:active{transform:scale(.97)}
.diff-btn.easy{background:#E8F8E8;border-color:#4CAF50;color:#1b5e20}
.diff-btn.mid{background:#FFF8E1;border-color:#FFB300;color:#E65100}
.diff-btn.hard{background:#FFEBEE;border-color:#E53935;color:#B71C1C}
.diff-btn .ico{font-size:2rem;line-height:1}
.diff-btn .meta{font-size:1rem;font-weight:800;opacity:.85;margin-top:2px}
.hud{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;
  margin-bottom:12px;font-size:clamp(1.05rem,2.8vw,1.25rem);font-weight:900}
.hud .pill{background:#E3F2FD;border:2px solid #90CAF9;border-radius:999px;padding:8px 14px;color:#1565C0}
.hud .pill.lives{background:#FFEBEE;border-color:#EF9A9A;color:#C62828}
.hud .pill.score{background:#E8F5E9;border-color:#A5D6A7;color:#2E7D32}
.hud .pill.warn{background:#FFF3E0;border-color:#FFB74D;color:#E65100;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.q-wrap{text-align:center}
.q-img-box{width:min(340px,78vw);aspect-ratio:1;margin:0 auto 14px;border-radius:22px;overflow:hidden;
  border:4px solid #7eb8e8;background:#f5fbff;box-shadow:0 8px 20px rgba(30,90,138,.12);
  position:relative}
.q-img-box img{width:100%;height:100%;object-fit:cover;display:block}
.q-img-box .feedback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  font-size:4rem;font-weight:900;background:rgba(255,255,255,.72)}
.q-img-box.ok .feedback{display:flex;color:#2E7D32}
.q-img-box.bad .feedback{display:flex;color:#C62828}
.q-prompt{font-size:clamp(1.35rem,3.5vw,1.7rem);font-weight:900;margin-bottom:12px;color:#1e5a8a}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:14px;min-height:72px;padding:12px 16px;border-radius:18px;
  border:4px solid #90CAF9;background:#F5FBFF;font-size:clamp(1.25rem,3.2vw,1.55rem);font-weight:900;
  cursor:pointer;transition:transform .1s,background .15s,border-color .15s;width:100%;text-align:left;color:#1a3a5c}
.opt:active{transform:scale(.97)}
.opt .badge{flex:0 0 52px;width:52px;height:52px;border-radius:50%;background:#2b8ad9;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:1.55rem;font-weight:900;
  box-shadow:0 3px 0 #1565C0}
.opt .txt{flex:1}
.opt.correct{border-color:#43A047;background:#E8F5E9}
.opt.correct .badge{background:#43A047;box-shadow:0 3px 0 #2E7D32}
.opt.wrong{border-color:#E53935;background:#FFEBEE;opacity:.85}
.opt.wrong .badge{background:#E53935;box-shadow:0 3px 0 #B71C1C}
.opt.disabled{pointer-events:none}
.bar-wrap{margin-top:14px;height:14px;background:#BBDEFB;border-radius:999px;overflow:hidden}
.bar{height:100%;width:100%;background:linear-gradient(90deg,#42A5F5,#1E88E5);transition:width .2s linear}
.bar.low{background:linear-gradient(90deg,#FFA726,#E53935)}
.end-score{font-size:clamp(2.4rem,8vw,3.6rem);font-weight:900;text-align:center;color:#1565C0;margin:8px 0}
.end-msg{font-size:clamp(1.25rem,3.5vw,1.55rem);font-weight:800;text-align:center;margin-bottom:14px;color:#2a5f8a}
.btn-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:12px}
.btn{min-width:140px;min-height:56px;padding:14px 22px;border-radius:16px;border:none;
  font-size:1.25rem;font-weight:900;cursor:pointer;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn.primary{background:#1E88E5}
.btn.secondary{background:#546E7A}
.btn.green{background:#43A047}
.cert-sheet{background:#fff;border:8px solid #F5C542;border-radius:24px;padding:20px 16px 22px;
  text-align:center;box-shadow:0 12px 32px rgba(0,0,0,.1),inset 0 0 0 4px #FFE08A;margin-top:8px}
.cert-sheet[data-tier="bronze"]{border-color:#CD7F32;box-shadow:0 12px 32px rgba(0,0,0,.1),inset 0 0 0 4px #E8B87A}
.cert-sheet[data-tier="silver"]{border-color:#A8B4C0;box-shadow:0 12px 32px rgba(0,0,0,.1),inset 0 0 0 4px #D7DEE6}
.cert-sheet[data-tier="gold"]{border-color:#F5C542;box-shadow:0 12px 32px rgba(0,0,0,.1),inset 0 0 0 4px #FFE08A}
.cert-medal{font-size:clamp(3.2rem,10vw,4.8rem);line-height:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.12))}
.cert-title{font-size:clamp(1.5rem,4vw,2.1rem);font-weight:900;color:#1e5a8a;margin:6px 0}
.cert-tier{display:inline-block;font-weight:900;font-size:1.2rem;padding:6px 16px;border-radius:999px;margin:4px 0 10px}
.cert-sheet[data-tier="bronze"] .cert-tier{background:#F3E0C7;color:#8B5A2B}
.cert-sheet[data-tier="silver"] .cert-tier{background:#E8EEF3;color:#5B6B7A}
.cert-sheet[data-tier="gold"] .cert-tier{background:#FFF3C4;color:#9A6B00}
.cert-name{font-size:clamp(1.5rem,4vw,2rem);font-weight:900;margin:6px 0 10px;color:#C2185B}
.cert-line{font-size:1.2rem;font-weight:800;color:#2a5f8a;margin:4px 0}
.cert-date{font-weight:700;opacity:.7;margin-top:8px;font-size:1rem}
.mute{position:fixed;top:10px;right:10px;z-index:50;width:48px;height:48px;border-radius:50%;
  border:3px solid #7eb8e8;background:#fff;font-size:1.3rem;cursor:pointer;font-weight:900;color:#1e5a8a}
@media print{
  @page{size:A4 landscape;margin:12mm}
  .header,.footer,.btn-row,.mute,.hud,#s-start,#s-play{display:none!important}
  #s-end.screen{display:block!important}
  body{background:#fff;overflow:visible}
  .cert-sheet{box-shadow:none}
}
</style>
</head>
<body oncontextmenu="return false">
<button class="mute" id="muteBtn" type="button" aria-label="音樂">🔊</button>
<div class="header">
  <h1>將軍澳培智學校</h1>
  <div class="sub">中國語文科 · 配詞遊戲</div>
</div>
<div class="main">
  <!-- START -->
  <section class="screen on" id="s-start">
    <div class="card">
      <h2>🧩 配詞遊戲</h2>
      <p style="text-align:center;font-size:1.15rem;font-weight:800;color:#3a7ab0;margin-bottom:8px">
        睇圖揀正確詞語啦！
      </p>
      <label class="field" for="playerName">你的名字（可選）</label>
      <input class="name" id="playerName" type="text" maxlength="12" placeholder="例如：小明" autocomplete="off">
      <p style="font-size:1.1rem;font-weight:800;margin:16px 0 4px;color:#1e5a8a">遊戲時間</p>
      <div class="time-grid" id="timeGrid" role="group" aria-label="遊戲時間">
        <button type="button" class="time-btn" data-min="1">1 分</button>
        <button type="button" class="time-btn" data-min="2">2 分</button>
        <button type="button" class="time-btn on" data-min="3">3 分</button>
        <button type="button" class="time-btn" data-min="5">5 分</button>
      </div>
      <p style="font-size:1.1rem;font-weight:800;margin:8px 0 4px;color:#1e5a8a">選擇難度</p>
      <div class="diff-grid">
        <button type="button" class="diff-btn easy" data-diff="easy">
          <span class="ico">🟢</span>
          <span><div>初級</div><div class="meta">5 次機會 · 每題 4 選 1</div></span>
        </button>
        <button type="button" class="diff-btn mid" data-diff="mid">
          <span class="ico">🟡</span>
          <span><div>中級</div><div class="meta">3 次機會 · 每題 3 選 1</div></span>
        </button>
        <button type="button" class="diff-btn hard" data-diff="hard">
          <span class="ico">🔴</span>
          <span><div>高級</div><div class="meta">2 次機會 · 每題 2 選 1</div></span>
        </button>
      </div>
    </div>
  </section>

  <!-- PLAY -->
  <section class="screen" id="s-play">
    <div class="card">
      <div class="hud">
        <span class="pill" id="hudTotal">總時 3:00</span>
        <span class="pill warn" id="hudQ">本題 10</span>
        <span class="pill score" id="hudScore">分數 0</span>
        <span class="pill lives" id="hudLives">❤️ 5</span>
      </div>
      <div class="q-wrap">
        <div class="q-img-box" id="imgBox">
          <img id="qImg" alt="題目圖片" draggable="false">
          <div class="feedback" id="fbIcon"></div>
        </div>
        <div class="q-prompt">揀正確嘅詞語</div>
        <button type="button" class="speak-btn" id="speakBtn" aria-label="廣東話讀題">🔊 讀題</button>
        <div class="opts" id="opts"></div>
        <div class="bar-wrap"><div class="bar" id="qBar"></div></div>
      </div>
    </div>
  </section>

  <!-- END -->
  <section class="screen" id="s-end">
    <div class="card">
      <h2 id="endTitle">做得好！</h2>
      <div class="end-score" id="endScore">0</div>
      <div class="end-msg" id="endMsg">你答對咗好多題！</div>
      <div class="cert-sheet" id="certSheet" data-tier="bronze">
        <div class="cert-medal" id="certMedal">🥉</div>
        <div class="cert-title">配詞小達人證書</div>
        <div class="cert-tier" id="certTier">銅牌</div>
        <div class="cert-name" id="certName">同學</div>
        <div class="cert-line">將軍澳培智學校 · 中國語文科</div>
        <div class="cert-line" id="certScoreLine">答對 0 題</div>
        <div class="cert-line" id="certDiffLine">難度：初級</div>
        <div class="cert-date" id="certDate"></div>
      </div>
      <div class="btn-row">
        <button type="button" class="btn green" id="btnPrint">🖨 列印證書</button>
        <button type="button" class="btn primary" id="btnAgain">再玩一次</button>
      </div>
    </div>
  </section>
</div>
<div class="footer">@2026 程棨彥老師</div>

  { id:"jianyu", word:"煎魚", img:IMG.jianyu },

  { id:"zhengshuidan", word:"蒸水蛋", img:IMG.zhengshuidan },

const DIFF = {
  easy: { lives:5, choices:4, label:"初級", emoji:"🟢" },
  mid:  { lives:3, choices:3, label:"中級", emoji:"🟡" },
  hard: { lives:2, choices:2, label:"高級", emoji:"🔴" }
};
const Q_MS = 10 * 1000;
const REVEAL_MS = 3000;
const LABELS = ["A","B","C","D"];
const DEFAULT_TOTAL_MS = 3 * 60 * 1000;

const S = {
  name: "",
  diff: "easy",
  score: 0,
  lives: 5,
  totalMs: DEFAULT_TOTAL_MS,
  totalLeft: DEFAULT_TOTAL_MS,
  qLeft: Q_MS,
  locked: false,
  order: [],
  idx: 0,
  cur: null,
  totalTimer: null,
  qTimer: null,
  muted: false,
  ended: false
};

let audioCtx = null;
let bgOsc = null;
let bgGain = null;
let bgPlaying = false;

function $(id){ return document.getElementById(id); }
function show(id){
  document.querySelectorAll(".screen").forEach(el => el.classList.remove("on"));
  $(id).classList.add("on");
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function ensureAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if(audioCtx.state === "suspended") audioCtx.resume();
}
function tone(freq, dur, type, vol){
  if(S.muted) return;
  ensureAudio();
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type || "sine";
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.12, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}
function sfxOk(){ tone(523,.12,"sine",.14); setTimeout(()=>tone(659,.12,"sine",.14),90); setTimeout(()=>tone(784,.18,"sine",.16),180); }
function sfxBad(){ tone(220,.2,"triangle",.12); setTimeout(()=>tone(180,.25,"triangle",.1),120); }
function sfxEnd(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.2,"sine",.14), i*120)); }
function pickZhHkVoice(){
  const voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  const prefer = [/zh[-_]hk/i, /yue/i, /cantonese/i, /hong\s*kong/i, /中文.*香港|香港.*中文/];
  for(const re of prefer){
    const v = voices.find(x => re.test(x.lang) || re.test(x.name));
    if(v) return v;
  }
  return voices.find(x => /^zh/i.test(x.lang)) || null;
}
function speakWord(text){
  if(!text || !window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = "zh-HK";
    u.rate = 0.9;
    u.pitch = 1.05;
    const v = pickZhHkVoice();
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}
function speakQuestion(){
  if(!S.cur) return;
  speakWord(S.cur.word);
}
function startBgm(){
  if(S.muted || bgPlaying) return;
  ensureAudio();
  bgGain = audioCtx.createGain();
  bgGain.gain.value = 0.035;
  bgGain.connect(audioCtx.destination);
  const notes = [262,330,392,330,294,349,440,349];
  let i = 0;
  function tick(){
    if(!bgPlaying || S.muted) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = "sine";
    o.frequency.value = notes[i % notes.length];
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 0.05);
    g.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.55);
    o.connect(g); g.connect(bgGain);
    o.start(); o.stop(audioCtx.currentTime + 0.6);
    i++;
    setTimeout(tick, 520);
  }
  bgPlaying = true;
  tick();
}
function stopBgm(){ bgPlaying = false; }

function fmt(ms){
  const s = Math.max(0, Math.ceil(ms/1000));
  const m = Math.floor(s/60);
  const r = s % 60;
  return m + ":" + String(r).padStart(2,"0");
}
function updateHud(){
  $("hudTotal").textContent = "總時 " + fmt(S.totalLeft);
  $("hudQ").textContent = "本題 " + Math.max(0, Math.ceil(S.qLeft/1000));
  $("hudScore").textContent = "分數 " + S.score;
  $("hudLives").textContent = "❤️ " + S.lives;
  const pct = Math.max(0, S.qLeft / Q_MS * 100);
  $("qBar").style.width = pct + "%";
  $("qBar").classList.toggle("low", pct < 30);
  $("hudQ").classList.toggle("warn", pct < 30);
}

function clearTimers(){
  if(S.totalTimer){ clearInterval(S.totalTimer); S.totalTimer = null; }
  if(S.qTimer){ clearInterval(S.qTimer); S.qTimer = null; }
}

function refillOrder(){
  S.order = shuffle(QUESTIONS.map((_,i)=>i));
  S.idx = 0;
}

function nextQuestion(){
  if(S.ended) return;
  if(S.lives <= 0 || S.totalLeft <= 0){ endGame(); return; }
  if(S.idx >= S.order.length) refillOrder();
  S.cur = QUESTIONS[S.order[S.idx++]];
  S.locked = false;
  S.qLeft = Q_MS;
  $("imgBox").classList.remove("ok","bad");
  $("fbIcon").textContent = "";
  $("qImg").src = S.cur.img;
  $("qImg").alt = S.cur.word;
  renderOptions(S.cur);
  updateHud();
  startQTimer();
  setTimeout(speakQuestion, 180);
}

function renderOptions(q){
  const n = DIFF[S.diff].choices;
  const others = QUESTIONS.filter(x => x.id !== q.id).map(x => x.word);
  const wrongs = shuffle(others).slice(0, n-1);
  const opts = shuffle([q.word, ...wrongs]);
  const box = $("opts");
  box.innerHTML = "";
  opts.forEach((w, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "opt";
    b.dataset.word = w;
    b.innerHTML = '<span class="badge">'+LABELS[i]+'</span><span class="txt">'+w+'</span>';
    b.addEventListener("click", () => pick(w, b));
    box.appendChild(b);
  });
}

function lockOpts(){
  document.querySelectorAll(".opt").forEach(el => el.classList.add("disabled"));
}

function pick(word, btn){
  if(S.locked || S.ended) return;
  S.locked = true;
  clearInterval(S.qTimer); S.qTimer = null;
  lockOpts();
  const ok = word === S.cur.word;
  document.querySelectorAll(".opt").forEach(el => {
    if(el.dataset.word === S.cur.word) el.classList.add("correct");
  });
  if(ok){
    btn.classList.add("correct");
    S.score += 1;
    $("imgBox").classList.add("ok");
    $("fbIcon").textContent = "✓";
    sfxOk();
    updateHud();
    setTimeout(() => nextQuestion(), 900);
  } else {
    if(btn) btn.classList.add("wrong");
    S.lives -= 1;
    $("imgBox").classList.add("bad");
    $("fbIcon").textContent = "✗";
    sfxBad();
    updateHud();
    setTimeout(() => {
      if(S.lives <= 0 || S.totalLeft <= 0) endGame();
      else nextQuestion();
    }, REVEAL_MS);
  }
}

function onTimeout(){
  if(S.locked || S.ended) return;
  S.locked = true;
  lockOpts();
  document.querySelectorAll(".opt").forEach(el => {
    if(el.dataset.word === S.cur.word) el.classList.add("correct");
  });
  S.lives -= 1;
  $("imgBox").classList.add("bad");
  $("fbIcon").textContent = "⏰";
  sfxBad();
  updateHud();
  setTimeout(() => {
    if(S.lives <= 0 || S.totalLeft <= 0) endGame();
    else nextQuestion();
  }, REVEAL_MS);
}

function startQTimer(){
  if(S.qTimer) clearInterval(S.qTimer);
  const t0 = Date.now();
  const startLeft = S.qLeft;
  S.qTimer = setInterval(() => {
    if(S.locked || S.ended) return;
    S.qLeft = startLeft - (Date.now() - t0);
    if(S.qLeft <= 0){
      S.qLeft = 0;
      updateHud();
      clearInterval(S.qTimer); S.qTimer = null;
      onTimeout();
      return;
    }
    updateHud();
  }, 100);
}

function startTotalTimer(){
  const t0 = Date.now();
  const startLeft = S.totalLeft;
  S.totalTimer = setInterval(() => {
    if(S.ended) return;
    S.totalLeft = startLeft - (Date.now() - t0);
    if(S.totalLeft <= 0){
      S.totalLeft = 0;
      updateHud();
      endGame();
      return;
    }
    updateHud();
  }, 250);
}

function tierFor(score){
  if(score >= 10) return { tier:"gold", medal:"🥇", label:"金牌", title:"太棒啦！", msg:"你係配詞小達人！" };
  if(score >= 5) return { tier:"silver", medal:"🥈", label:"銀牌", title:"好叻！", msg:"繼續加油，你可以更勁！" };
  return { tier:"bronze", medal:"🥉", label:"銅牌", title:"做得好！", msg:"你有用心學習，好乖！" };
}

function endGame(){
  if(S.ended) return;
  S.ended = true;
  clearTimers();
  stopBgm();
  sfxEnd();
  const t = tierFor(S.score);
  const name = S.name || "同學";
  $("endTitle").textContent = t.title;
  $("endScore").textContent = S.score;
  $("endMsg").textContent = t.msg + "（答對 " + S.score + " 題）";
  $("certSheet").dataset.tier = t.tier;
  $("certMedal").textContent = t.medal;
  $("certTier").textContent = t.label;
  $("certName").textContent = name;
  $("certScoreLine").textContent = "答對 " + S.score + " 題";
  $("certDiffLine").textContent = "難度：" + DIFF[S.diff].label;
  const d = new Date();
  $("certDate").textContent = d.getFullYear() + "年" + (d.getMonth()+1) + "月" + d.getDate() + "日";
  show("s-end");
}

function getSelectedTotalMs(){
  const on = document.querySelector(".time-btn.on");
  const min = on ? parseInt(on.dataset.min, 10) : 3;
  return (Number.isFinite(min) && min > 0 ? min : 3) * 60 * 1000;
}
function startGame(diff){
  ensureAudio();
  if(window.speechSynthesis) speechSynthesis.getVoices();
  startBgm();
  S.name = ($("playerName").value || "").trim().slice(0,12);
  S.diff = diff;
  S.score = 0;
  S.lives = DIFF[diff].lives;
  S.totalMs = getSelectedTotalMs();
  S.totalLeft = S.totalMs;
  S.qLeft = Q_MS;
  S.locked = false;
  S.ended = false;
  refillOrder();
  show("s-play");
  updateHud();
  clearTimers();
  startTotalTimer();
  nextQuestion();
}

// Wire UI
document.querySelectorAll(".time-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".time-btn").forEach(b => b.classList.remove("on"));
    btn.classList.add("on");
  });
});
document.querySelectorAll(".diff-btn").forEach(btn => {
  btn.addEventListener("click", () => startGame(btn.dataset.diff));
});
$("speakBtn").addEventListener("click", () => speakQuestion());
$("btnAgain").addEventListener("click", () => {
  clearTimers();
  stopBgm();
  if(window.speechSynthesis) speechSynthesis.cancel();
  show("s-start");
});
$("btnPrint").addEventListener("click", () => window.print());
$("muteBtn").addEventListener("click", () => {
  S.muted = !S.muted;
  $("muteBtn").textContent = S.muted ? "🔇" : "🔊";
  if(S.muted){
    stopBgm();
    if(window.speechSynthesis) speechSynthesis.cancel();
  } else if(!S.ended && $("s-play").classList.contains("on")) startBgm();
});
if(window.speechSynthesis){
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
}

// Prevent image drag / gesture extras
document.addEventListener("dragstart", e => e.preventDefault());
</script>
</body>
</html>
